name: cli-image

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "cli/**"
      - "lib/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/cli-image.yml"
  workflow_call:
    inputs:
      version:
        description: "Release tag to publish the image under"
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push datum-connect image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ github.event_name != 'pull_request' && (inputs.version || github.ref_name) || '' }}
          tags: ${{ github.event_name != 'pull_request' && format('ghcr.io/datum-cloud/datum-connect:{0}', inputs.version || github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
